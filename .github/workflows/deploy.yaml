name: Deploy Complex
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  REGISTRY: ghcr.io/dcottr42/many-containers

jobs:
  # test-client:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: docker build -t react-test -f ./client/Dockerfile.dev ./client
  #     - run: docker run -e CI=true react-test npm test
  build:
    # needs: test-client
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy: &services
      matrix:
        include:
          - { service: client, app: client }
          - { service: nginx,  app: nginx }
          - { service: server, app: api }
          - { service: worker, app: worker }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy: *services
    permissions:
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az containerapp update -n ${{ matrix.app }} -g fib-rg --image ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
